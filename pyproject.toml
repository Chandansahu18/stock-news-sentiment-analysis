[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-sentiment"
version = "0.1.0"
description = "Indian stock news sentiment demo with FastAPI and Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg2-binary>=2.9,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
worker = [
  "apscheduler>=3.10,<4",
  "feedparser>=6.0,<7",
  "requests>=2.32,<3",
  "yfinance>=0.2,<1",
  "pandas>=2.2,<3",
  "transformers>=4.53,<5",
]
dashboard = [
  "streamlit>=1.38,<2",
  "streamlit-autorefresh>=1.0,<2",
  "plotly>=5.24,<7",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not live and not model and not integration'"
markers = [
  "integration: requires an approved PostgreSQL test database",
  "live: contacts an external data provider; explicit approval required",
  "model: requires an approved local FinBERT download",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
